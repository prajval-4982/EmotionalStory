<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story-Generator</title>
    <link rel="icon" type="image/x-icon" href="/static/pen-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="studio-container">
    <aside class="sidebar">
        <div class="brand">
            <h1>Emotional<br><span class="highlight">Story-Generator</span></h1>
            <p>Emotion-Driven Narrative Engine</p>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Story Seed</label>
                <textarea id="prompt" placeholder="e.g. An astronaut realizes his radio has been disconnected for weeks..."></textarea>
            </div>

            <div class="control-group">
                <label>Target Emotion</label>
                <div class="emotion-grid" id="emotionGrid">
                    <button class="chip active" data-value="sad">Sadness</button>
                    <button class="chip" data-value="happy">Joy</button>
                    <button class="chip" data-value="fear">Fear</button>
                    <button class="chip" data-value="anger">Anger</button>
                    <button class="chip" data-value="curiosity">Mystery</button>
                    <button class="chip" data-value="hope">Hope</button>
                </div>
                <input type="hidden" id="selectedEmotion" value="sad">
            </div>

            <div class="control-group">
                <div class="slider-header">
                    <label>Emotional Intensity</label>
                    <span id="strengthValue">5</span>
                </div>
                <input type="range" id="strength" min="1" max="10" value="5" class="slider" oninput="updateValues()">
            </div>

            <div class="control-group">
                <div class="slider-header">
                    <label>Creativity (Temperature)</label>
                    <span id="creativityValue">0.8</span>
                </div>
                <input type="range" id="creativity" min="0.6" max="1.2" step="0.05" value="0.8" class="slider" oninput="updateValues()">
            </div>

            <button id="generateBtn" onclick="generateStory()">
                <span class="btn-text">Weave Story</span>
                <span class="btn-icon">✨</span>
            </button>
            
            <button id="saveBtn" class="secondary-btn" onclick="saveStory()" disabled>
                Download Text
            </button>
        </div>
    </aside>

    <main class="editor-area">
        <div class="paper-wrapper">
            <div id="storyOutput" class="story-content">
                <div class="empty-state">
                    <div style="font-size: 3rem; opacity: 0.2; margin-bottom: 10px;">✒️</div>
                    <p style="color: #64748b; font-family: 'Inter', sans-serif; font-size: 0.9rem;">Select an emotion and click "Weave Story" to begin...</p>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="/static/script.js"></script>
</body>
</html>
